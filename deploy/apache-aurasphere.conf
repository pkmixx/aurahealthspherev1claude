# Reference copy of the production Apache config (Ubuntu, /etc/apache2/sites-available/).
# The :443 block lives in aurasphere-le-ssl.conf; certbot --apache adds the SSL lines.
# Requires: a2enmod rewrite headers ssl

# aurasphere.conf: all plain-HTTP requests (apex and www) → https://aurasphere.co.in, path and query kept
<VirtualHost *:80>
    ServerName aurasphere.co.in
    ServerAlias www.aurasphere.co.in
    Redirect permanent / https://aurasphere.co.in/
</VirtualHost>

# aurasphere-le-ssl.conf
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName aurasphere.co.in
    ServerAlias www.aurasphere.co.in
    DocumentRoot /var/www/aurasphere

    <Directory /var/www/aurasphere>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    # www -> apex (canonical host)
    RewriteCond %{HTTP_HOST} ^www\. [NC]
    RewriteRule ^ https://aurasphere.co.in%{REQUEST_URI} [R=301,L,NE]
    # Prerendered pages: /healthcare (or /healthcare/) -> /healthcare.html
    RewriteCond %{DOCUMENT_ROOT}$1.html -f
    RewriteRule ^(/.+?)/?$ $1.html [L]
    ErrorDocument 404 /404.html
    # robots.txt, llms.txt and sitemap.xml contain UTF-8 (°, —)
    AddCharset UTF-8 .txt .xml

    # Hashed build assets never change; HTML always revalidates
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <FilesMatch "\.html$">
        Header set Cache-Control "no-cache"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/aurasphere_error.log
    CustomLog ${APACHE_LOG_DIR}/aurasphere_access.log combined

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/aurasphere.co.in/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/aurasphere.co.in/privkey.pem
</VirtualHost>
</IfModule>
